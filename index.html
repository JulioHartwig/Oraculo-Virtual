<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oráculo Virtual</title>
<style>
:root{color-scheme:dark;--bg:#050308;--card:#0e0914;--fg:#e6dff0;--muted:#8a7c9f;--accent:#7a1530;--accent2:#4b1d7a;--line:#2b1a3c;--ans:#f1e6ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a0f2e 0%,#12081a 38%,var(--bg) 75%);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
header{text-align:center;margin-bottom:20px}
.orb{font-size:60px;line-height:1;animation:glow 4s ease-in-out infinite}
h1{margin:8px 0 4px;font-size:30px;letter-spacing:6px;text-transform:uppercase;font-weight:normal;text-shadow:0 0 18px rgba(179,38,46,.6)}
.sub{color:var(--muted);margin:0;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 0 40px rgba(122,21,48,.25),inset 0 0 30px rgba(0,0,0,.6)}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-family:system-ui,sans-serif}
label:first-child{margin-top:0}
input[type=text]{width:100%;padding:12px 14px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font-family:inherit}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
button{margin-top:18px;width:100%;padding:13px;font-size:17px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-family:system-ui,sans-serif;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:10px;font-weight:400;font-size:14px}
#out{min-height:90px;text-align:center;margin-top:20px;display:flex;align-items:center;justify-content:center;flex-direction:column}
#out .q{color:var(--muted);font-size:14px;font-style:italic;margin-bottom:8px;word-break:break-word}
#out .a{font-size:26px;font-style:italic;line-height:1.3;color:var(--ans);word-break:break-word;text-shadow:0 0 16px rgba(190,120,255,.7);animation:fade 2.2s ease both}
#out .w{color:var(--muted);animation:pulse 1.2s infinite}
@keyframes fade{from{opacity:0;transform:scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px #7a1530)}50%{filter:drop-shadow(0 0 26px #8a3cff)}}
@keyframes pulse{50%{opacity:.3}}
details{margin-top:18px;font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
summary{cursor:pointer}
details ol{padding-left:20px;line-height:1.5}
code{background:color-mix(in srgb,var(--accent) 18%,transparent);padding:1px 6px;border-radius:5px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<main>
<header>
<div class="orb">🔮</div>
<h1>Oráculo Virtual</h1>
<p class="sub">Faça sua pergunta. As sombras responderão.</p>
</header>
<div class="card">
<label for="req">Seu pedido ao oráculo</label>
<input type="text" id="req" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Oráculo, por favor, responda…">
<label for="qst">Sua pergunta</label>
<input type="text" id="qst" autocomplete="off" spellcheck="false" placeholder="Ex.: Qual é o nome da minha música favorita?">
<button id="go" type="button">Consultar o Oráculo</button>
<button id="reset" type="button" class="ghost">Nova consulta</button>
<div id="out" aria-live="polite"></div>
</div>
<footer>Algumas respostas é melhor não ouvir. 🌑</footer>
</main>
<script>
(function(){
var COVER="Oráculo, por favor, responda à minha pergunta com sinceridade.";
var req=document.getElementById("req"),qst=document.getElementById("qst"),
go=document.getElementById("go"),rs=document.getElementById("reset"),out=document.getElementById("out");
var raw="",prevLen=0;
var RANDOM=["Você precisa acreditar","O destino não está em suas mãos","A luz da lua é reveladora","O cotidiano é uma dádiva","Não deixe de acreditar","As sombras já sabem a resposta","Nem tudo o que se esconde quer ser encontrado","O silêncio responde melhor que as palavras","Aquilo que você teme já está a caminho","Olhe para trás antes de decidir"];

function compute(){
  if(raw.charAt(0)!=="."){return raw;}
  var close=raw.indexOf(".",1);
  if(close===-1){return COVER.slice(0,Math.min(raw.length,COVER.length));}
  var shown=COVER.slice(0,Math.min(close+1,COVER.length));
  return shown+raw.slice(close+1);
}
function secret(){
  if(raw.charAt(0)!==".")return null;
  var close=raw.indexOf(".",1);
  var s=close===-1?raw.slice(1):raw.slice(1,close);
  return s.trim()?s:null;
}
function render(){
  var v=compute();
  req.value=v;prevLen=v.length;
  try{req.setSelectionRange(v.length,v.length);}catch(e){}
}
req.addEventListener("input",function(){
  var v=req.value;
  if(v.length>prevLen){raw+=v.slice(prevLen>v.length?0:v.length-(v.length-prevLen));}
  else if(v.length<prevLen){raw=raw.slice(0,Math.max(0,raw.length-(prevLen-v.length)));}
  render();
});
req.addEventListener("paste",function(e){e.preventDefault();});
req.addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();qst.focus();}
  if((e.key==="ArrowLeft"||e.key==="Home")){e.preventDefault();}
});
req.addEventListener("click",function(){render();});
qst.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();ask();}});
qst.addEventListener("input",function(){
  if(qst.value.slice(-1)==="?"&&!go.disabled){qst.blur();ask();}
});

function esc(t){return t.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ask(){
  var q=qst.value.trim();
  if(!q){qst.focus();return;}
  var s=secret();
  var ans=s?s.trim():RANDOM[Math.floor(Math.random()*RANDOM.length)];
  go.disabled=true;
  out.innerHTML='<div class="w">🌑 O oráculo escuta as sombras…</div>';
  setTimeout(function(){
    out.innerHTML='<div class="q">“'+esc(q)+'”</div><div class="a">'+esc(ans)+'</div>';
    go.disabled=false;
  },2200);
}
go.addEventListener("click",ask);
rs.addEventListener("click",function(){
  raw="";prevLen=0;req.value="";qst.value="";out.innerHTML="";req.focus();
});
})();
</script>
</body>
</html>
